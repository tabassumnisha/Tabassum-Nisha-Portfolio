name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP into repo
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            rm -rf /tmp/zx && mkdir -p /tmp/zx
            for z in "${zips[@]}"; do
              echo "Extracting $z"
              unzip -o -q "$z" -d /tmp/zx
            done
            rm -rf /tmp/zx/.github
            cp -rf /tmp/zx/. .
            rm -f -- "${zips[@]}"
            echo "Files placed:"
            ls -la index.html styles.css script.js assets/Tabassum-Nisha-CV.pdf
          else
            echo "No ZIP found, using existing files"
          fi

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Auto extract ZIP [skip ci]"
            git push
            echo "Committed to repo"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
